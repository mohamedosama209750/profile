<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Mohamed Osama — product designer and front-end engineer based in Cairo, EG. A profile page built with React, Vite, and an Apple-inspired glass aesthetic."
    />
    <meta property="og:title" content="Mohamed Osama — Product Designer & Front-End Engineer" />
    <meta
      property="og:description"
      content="A profile page built with React, Vite, CSS Modules, and an Apple-inspired glass aesthetic."
    />
    <meta property="og:type" content="website" />
    <title>Mohamed Osama — Product Designer & Front-End Engineer</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('profile-theme');
          document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
